<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futbol Onega</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Futbol Onega">
<meta name="theme-color" content="#1c7a41">
<style>
html,body{margin:0;height:100%;background:#eef2ec}
body{display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
iframe{border:0;width:100%;flex:1;min-height:0;display:block}
#bar{display:flex;gap:10px;align-items:center;background:#14201a;color:#fff;padding:10px 12px;font-size:14px}
#bar[hidden]{display:none}
#bar span{flex:1}
#bar button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;background:#4cc47a;color:#06210f}
#bar button.x{background:transparent;color:#fff;padding:9px 6px;font-size:18px}
</style>
</head>
<body>
<div id="bar" hidden><span>Tocá para permitir las notificaciones de Futbol Onega.</span><button id="bar-ok" type="button">Permitir</button><button id="bar-x" class="x" type="button" aria-label="Cerrar">&times;</button></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbz64qcffAGEMLlJwk0X9j1N-bgKVFx0WO2plIeemHvZ6OStG6f7A4J-Poog3gwL6lS8/exec" title="Futbol Onega" allow="clipboard-write"></iframe>
<script>
// App ID de OneSignal (es público). Vacío = notificaciones al celular apagadas.
var ONESIGNAL_APP_ID = '7a024884-945d-4925-98c3-92b35da09927';

var OS = null, fuente = null, jugador = '';
try { jugador = localStorage.getItem('onega-jugador') || ''; } catch (e) {}
var bar = document.getElementById('bar');
var esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var instalada = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

function estado() {
  var s = { onega: 'estado', config: !!ONESIGNAL_APP_ID, ios: esIOS, instalada: instalada, soportado: false, activo: false, bloqueado: false };
  try {
    if (OS) {
      s.soportado = OS.Notifications.isPushSupported();
      s.activo = !!(OS.Notifications.permission && OS.User.PushSubscription.optedIn);
      s.bloqueado = typeof Notification !== 'undefined' && Notification.permission === 'denied';
    }
  } catch (e) {}
  return s;
}
function informar() { try { if (fuente) fuente.postMessage(estado(), '*'); } catch (e) {} }
function identificar() { if (!OS) return Promise.resolve(); try { return Promise.resolve(jugador ? OS.login((esIOS ? 'i:' : 'a:') + jugador) : OS.logout()).catch(function () {}); } catch (e) { return Promise.resolve(); } }

// Pide el permiso. Si el celular exige un toque directo en esta página, muestra la barra para darlo.
function activar(directo) {
  if (!OS) return;
  var p;
  try { p = Promise.resolve(OS.Notifications.requestPermission()); } catch (e) { p = Promise.reject(e); }
  p.catch(function () {}).then(function () {
    var concedido = false;
    try { concedido = !!OS.Notifications.permission; } catch (e) {}
    if (!concedido) {
      var negado = typeof Notification !== 'undefined' && Notification.permission === 'denied';
      bar.hidden = !!(directo || negado);
      return;
    }
    bar.hidden = true;
    return Promise.resolve(OS.User.PushSubscription.optIn()).catch(function () {}).then(identificar);
  }).then(informar);
}
function desactivar() {
  if (!OS) return;
  Promise.resolve().then(function () { return OS.User.PushSubscription.optOut(); }).catch(function () {}).then(informar);
}
document.getElementById('bar-ok').addEventListener('click', function () { activar(true); });
document.getElementById('bar-x').addEventListener('click', function () { bar.hidden = true; });

// La app (que corre dentro de Google) avisa quién es el jugador y pide activar o desactivar.
window.addEventListener('message', function (e) {
  var host = '';
  try { host = new URL(e.origin).hostname; } catch (err) { return; }
  if (!/(^|\.)googleusercontent\.com$/.test(host) || !e.data || typeof e.data !== 'object') return;
  fuente = e.source;
  if (e.data.onega === 'jugador') {
    var n = String(e.data.nombre || '').slice(0, 40);
    if (n !== jugador) { jugador = n; try { localStorage.setItem('onega-jugador', n); } catch (err) {} identificar(); }
  } else if (e.data.onega === 'push') {
    if (e.data.accion === 'activar') activar(false); else if (e.data.accion === 'desactivar') desactivar();
  }
  informar();
});

if (ONESIGNAL_APP_ID) {
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(function (OneSignal) {
    return OneSignal.init({ appId: ONESIGNAL_APP_ID, welcomeNotification: { disable: true } }).then(function () {
      OS = OneSignal;
      try { OS.Notifications.addEventListener('permissionChange', informar); OS.User.PushSubscription.addEventListener('change', informar); } catch (e) {}
      return identificar();
    }).then(informar).catch(informar);
  });
  var sdk = document.createElement('script');
  sdk.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
  sdk.defer = true;
  document.head.appendChild(sdk);
}
</script>
</body>
</html>
